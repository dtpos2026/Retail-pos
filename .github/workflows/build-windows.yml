name: Build Windows installer

on:
  workflow_dispatch:
  push:
    tags: ['v*']
    branches: ['**']
    paths-ignore:
      - 'superadmin/**'
      - 'docs/**'
      - '**.md'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build installer and portable EXE
        run: npx vite build && npx electron-builder --win nsis portable --x64 --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RetailPOS-Windows
          path: |
            release/*.exe
          if-no-files-found: error
