<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; background: transparent; overflow: hidden; font-family: 'Segoe UI', system-ui, Arial, sans-serif; user-select: none; -webkit-app-region: drag; }
  .card {
    position: absolute; inset: 14px; border-radius: 28px; color: #fff; overflow: hidden;
    background: radial-gradient(420px 260px at 15% 0%, #7c3aed 0%, transparent 65%), radial-gradient(360px 240px at 100% 100%, #c026d3 0%, transparent 60%), linear-gradient(160deg, #2a0a55, #150330);
    box-shadow: 0 24px 60px rgba(20, 0, 50, .55), 0 0 0 1px rgba(255,255,255,.08) inset;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
    animation: cardIn .5s cubic-bezier(.2,.9,.3,1) both;
  }
  .orb { position: absolute; border-radius: 50%; filter: blur(46px); opacity: .5; animation: drift 6s ease-in-out infinite; }
  .orb.a { width: 200px; height: 200px; background: #8b5cf6; top: -60px; left: -40px; }
  .orb.b { width: 170px; height: 170px; background: #f5b301; bottom: -70px; right: -30px; opacity: .22; animation-delay: -3s; }
  svg.mark { width: 92px; height: 92px; margin-bottom: 8px; filter: drop-shadow(0 8px 22px rgba(0,0,0,.35)); }
  svg.mark path { fill: #fff; transform-box: fill-box; transform-origin: center; opacity: 0; animation: tri .55s cubic-bezier(.2,1.3,.4,1) forwards; }
  svg.mark path:nth-child(1) { animation-delay: .25s; } svg.mark path:nth-child(2) { animation-delay: .4s; }
  svg.mark path:nth-child(3) { animation-delay: .55s; } svg.mark path:nth-child(4) { animation-delay: .7s; }
  h1 { font-size: 30px; font-weight: 800; letter-spacing: .02em; opacity: 0; animation: up .6s .85s ease-out forwards; }
  .tag { font-size: 13px; opacity: 0; letter-spacing: .04em; animation: up .6s 1s ease-out forwards; color: #e9d5ff; }
  .bar { width: 220px; height: 4px; border-radius: 4px; background: rgba(255,255,255,.16); margin-top: 22px; overflow: hidden; opacity: 0; animation: up .4s 1.05s ease-out forwards; }
  .bar i { display: block; height: 100%; width: 40%; border-radius: 4px; background: linear-gradient(90deg, transparent, #fff, transparent); animation: slide 1.1s ease-in-out infinite; }
  .foot { position: absolute; bottom: 18px; left: 0; right: 0; text-align: center; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: rgba(255,255,255,.62); opacity: 0; animation: up .6s 1.2s ease-out forwards; }
  .foot b { color: #fff; letter-spacing: .08em; }
  @keyframes cardIn { from { opacity: 0; transform: scale(.94) translateY(10px); } to { opacity: 1; transform: none; } }
  @keyframes tri { from { opacity: 0; transform: scale(.2) rotate(-25deg); } to { opacity: 1; transform: none; } }
  @keyframes up { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  @keyframes slide { from { transform: translateX(-120%); } to { transform: translateX(320%); } }
  @keyframes drift { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(24px, 18px); } }
</style>
</head>
<body>
  <div class="card">
    <div class="orb a"></div><div class="orb b"></div>
    <svg class="mark" viewBox="0 0 340 340"><path d="M0 0H168.5V168.5Z"/><path d="M171 0H340V168.5Z"/><path d="M0 171.5H168.5V340Z"/><path d="M171 171.5H340V340Z"/></svg>
    <h1>DT RETAIL POS</h1>
    <div class="tag">Simple Offline POS for Small Businesses</div>
    <div class="bar"><i></i></div>
    <div class="foot">Developed by <b>Digital Target</b> · v<span id="v">1.0.0</span></div>
  </div>
  <script>
    var m = /[?&]v=([^&]+)/.exec(location.search);
    if (m) document.getElementById('v').textContent = decodeURIComponent(m[1]);
  </script>
</body>
</html>
